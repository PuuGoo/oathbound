<!doctype html>
<!-- PROTOTYPE - NOT FOR PRODUCTION: local reference viewer, not part of the game. -->
<meta charset="utf-8"><title>Estrilda supplied video — reference frame</title>
<style>body{margin:0;background:#101820;color:#f4e9d2;font:16px Arial}header{padding:12px}video{display:block;width:100%;height:650px;object-fit:contain}</style>
<header id="status">Loading supplied local video…</header>
<video muted preload="auto" src="file:///C:/Users/PuuGoo/Downloads/Estrilda_GamePlay.mp4"></video>
<script>
const video=document.querySelector('video'),label=document.querySelector('#status');
const requested=Number(new URLSearchParams(location.search).get('at')||3);
video.addEventListener('loadedmetadata',()=>{label.textContent=`Supplied reference: ${video.videoWidth}×${video.videoHeight}, duration ${video.duration.toFixed(2)}s; seeking ${requested}s`;video.currentTime=Math.min(requested,Math.max(0,video.duration-.1));});
video.addEventListener('seeked',()=>{video.pause();label.textContent+=` — frame decoded at ${video.currentTime.toFixed(2)}s`;});
video.addEventListener('error',()=>{label.textContent=`Could not decode supplied reference (media error ${video.error?.code}).`;console.error(label.textContent);});
</script>
